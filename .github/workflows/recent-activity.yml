name: Recent activity

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rewrite the list
        run: python3 .github/scripts/recent_activity.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Redraw the profile card
        run: python3 .github/scripts/profile_card.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit if it changed
        run: |
          git add README.md .github/profile
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Update recent activity and profile card"
            git push -q
          fi
